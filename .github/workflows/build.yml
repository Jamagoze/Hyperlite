name: Build HyperLite

on:
  workflow_dispatch:
  push:
    paths:
      - 'hyperlite.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build HyperLite Module
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip curl

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "ndk;27.2.12479018" \
            "cmake;3.31.0"

          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Extract HyperLite
        run: |
          if [ ! -f hyperlite.zip ]; then
            echo "::error::hyperlite.zip not found in repository root"
            exit 1
          fi

          mkdir -p extracted
          unzip -q hyperlite.zip -d extracted

          if [ ! -f extracted/hyperlite/build.sh ]; then
            echo "::error::hyperlite/build.sh not found inside archive"
            echo "Archive contents:"
            unzip -l hyperlite.zip
            exit 1
          fi

      - name: Compile HyperLite
        run: |
          cd extracted/hyperlite
          chmod +x build.sh
          bash build.sh

      - name: Verify Output
        run: |
          OUTPUT="extracted/hyperlite/out/HyperLite.zip"

          if [ ! -f "$OUTPUT" ]; then
            echo "::error::HyperLite.zip was not generated"
            exit 1
          fi

          echo "Build successful!"
          ls -lh "$OUTPUT"
          unzip -t "$OUTPUT"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: HyperLite
          path: extracted/hyperlite/out/HyperLite.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
