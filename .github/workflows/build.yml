name: Build Hooks

on:
  workflow_dispatch:
  push:
    paths:
      - 'highend_home.zip'
      - 'framework_hook.zip'
      - 'systemui_hook.zip'
      - 'settings_hook.zip'
      - 'plugin_hook.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [highend_home, framework_hook, systemui_hook, settings_hook, plugin_hook]
    env:
      # Optional: classic PAT stored as repo secret HYPERCEILER_PACKAGES_TOKEN
      # (Settings > Secrets and variables > Actions). Only needed for GitHub Packages dependencies.
      GPR_USER: ${{ github.actor }}
      GPR_TOKEN: ${{ secrets.HYPERCEILER_PACKAGES_TOKEN }}
      ORG_GRADLE_PROJECT_gpr.user: ${{ github.actor }}
      ORG_GRADLE_PROJECT_gpr.key: ${{ secrets.HYPERCEILER_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        id: ex
        run: |
          if [ -f "${{ matrix.name }}.zip" ]; then
            rm -rf src_build && mkdir src_build
            unzip -q "${{ matrix.name }}.zip" -d src_build
            rm -rf src_build/.github
            echo "ok=1" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v4
        if: steps.ex.outputs.ok == '1'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.ex.outputs.ok == '1'
        with:
          gradle-version: '8.7'

      - name: Build
        if: steps.ex.outputs.ok == '1'
        working-directory: src_build
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        if: steps.ex.outputs.ok == '1'
        run: |
          mkdir -p out
          cp src_build/app/build/outputs/apk/release/*.apk out/${{ matrix.name }}.apk

      - uses: actions/upload-artifact@v4
        if: steps.ex.outputs.ok == '1'
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}.apk
