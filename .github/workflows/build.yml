name: Build HyperLite Module

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HyperLite
    runs-on: ubuntu-24.04

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install required Linux packages
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            zip \
            curl \
            git \
            build-essential

      # Configure Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Configure Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Install Android SDK components
      - name: Install Android SDK Components
        run: |
          set -e

          yes | sdkmanager --licenses

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.31.0"

          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # Extract source archive if present
      - name: Extract HyperLite Source
        run: |
          set -e

          if [ -f "hyperlite.zip" ]; then
            echo "Extracting hyperlite.zip..."

            mkdir -p source
            unzip -o hyperlite.zip -d source

          elif [ -f "HyperLite.zip" ]; then
            echo "Extracting HyperLite.zip..."

            mkdir -p source
            unzip -o HyperLite.zip -d source

          else
            echo "No source ZIP found. Using repository files."
          fi

      # Locate project directory
      - name: Locate Build Project
        run: |
          set -e

          if [ -d "source" ]; then
            PROJECT_DIR="source"
          else
            PROJECT_DIR="."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | head -100

      # Build with Gradle if available
      - name: Build HyperLite
        run: |
          set -e

          PROJECT_DIR="$PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper detected."

            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              --stacktrace \
              assembleDebug

          elif [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ]; then
            echo "Gradle project detected."

            gradle \
              --no-daemon \
              --stacktrace \
              assembleDebug

          elif [ -f "./Android.mk" ]; then
            echo "Android NDK project detected."

            "$ANDROID_NDK_HOME/ndk-build" \
              -j2 \
              NDK_PROJECT_PATH=. \
              APP_BUILD_SCRIPT=./Android.mk

          elif [ -f "./CMakeLists.txt" ]; then
            echo "CMake project detected."

            cmake -S . -B build \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release

            cmake --build build --parallel 2

          else
            echo "ERROR: No supported build configuration found."
            echo "Expected Gradle, Android.mk, or CMakeLists.txt."
            exit 1
          fi

      # Collect build outputs
      - name: Collect Build Outputs
        if: success()
        run: |
          set -e

          mkdir -p artifacts

          echo "Searching for compiled files..."

          find "$PROJECT_DIR" \
            -type f \
            \( \
              -name "*.apk" \
              -o -name "*.aab" \
              -o -name "*.so" \
              -o -name "*.zip" \
            \) \
            -not -path "*/.gradle/*" \
            -not -path "*/.git/*" \
            -exec cp -v {} artifacts/ \;

          echo "Collected files:"
          ls -lah artifacts/

      # Upload compiled files
      - name: Upload HyperLite Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HyperLite-Build
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
