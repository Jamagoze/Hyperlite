name: Build HyperLite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Zygisk module

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract source zip
        run: unzip -oq hyperlite.zip -d .

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Build module
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x hyperlite/build.sh
          bash hyperlite/build.sh

      - name: Upload flashable module
        uses: actions/upload-artifact@v4
        with:
          name: HyperLite
          path: hyperlite/out/HyperLite.zip
